<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="word" x1="56" y1="110" x2="430" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2fe3c0"/>
      <stop offset="0.55" stop-color="#21AD9A"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21AD9A"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3BEBC9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="url(#bg)" stroke="#1b2a27" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="378" rx="22" fill="none" stroke="#21AD9A" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- ============ LEFT ============ -->
  <g transform="translate(56,0)">
    <!-- eyebrow -->
    <rect x="0" y="54" width="34" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="46" y="60" fill="#8a9099" font-size="13" letter-spacing="3" font-weight="600">ANDROID · WEBVIEW · ON-DEVICE</text>

    <!-- logo mark (matches the app launcher icon) + wordmark -->
    <svg x="-4" y="90" width="62" height="62" viewBox="0 0 32 32" fill="none">
      <path fill-rule="evenodd" fill="url(#ecg)"
            d="M16,16 m-13,0 a13,13 0 1,0 26,0 a13,13 0 1,0 -26,0 M22.5,10.4 m-11.14,0 a11.14,11.14 0 1,0 22.28,0 a11.14,11.14 0 1,0 -22.28,0"/>
      <circle cx="27.1" cy="5.8" r="2.34" fill="#00E5C8"/>
    </svg>
    <text x="72" y="150" fill="url(#word)" font-size="84" font-weight="800" letter-spacing="-2">Ecliptic</text>

    <!-- tagline -->
    <text x="0" y="196" fill="#E8EAED" font-size="24" font-weight="600">Fingerprint any website from your phone.</text>

    <!-- subtitle -->
    <text x="0" y="228" fill="#7f868f" font-size="15">Native tech-stack scanner, HTTP recon &amp; spider — one app,</text>
    <text x="0" y="250" fill="#7f868f" font-size="15">no backend, no telemetry, nothing leaves your device.</text>

    <!-- pills -->
    <g transform="translate(0,280)" font-size="13" font-weight="600">
      <g>
        <rect x="0" y="0" width="92" height="30" rx="15" fill="#10231f" stroke="#21AD9A" stroke-opacity="0.5"/>
        <text x="46" y="20" fill="#5eead4" text-anchor="middle">WebView</text>
      </g>
      <g transform="translate(104,0)">
        <rect x="0" y="0" width="116" height="30" rx="15" fill="#161a20" stroke="#2b3440"/>
        <text x="58" y="20" fill="#aeb4bd" text-anchor="middle">Wappalyzer DB</text>
      </g>
      <g transform="translate(232,0)">
        <rect x="0" y="0" width="92" height="30" rx="15" fill="#161a20" stroke="#2b3440"/>
        <text x="46" y="20" fill="#aeb4bd" text-anchor="middle">Compose</text>
      </g>
      <g transform="translate(336,0)">
        <rect x="0" y="0" width="80" height="30" rx="15" fill="#161a20" stroke="#2b3440"/>
        <text x="40" y="20" fill="#aeb4bd" text-anchor="middle">OkHttp</text>
      </g>
      <g transform="translate(428,0)">
        <rect x="0" y="0" width="74" height="30" rx="15" fill="#161a20" stroke="#2b3440"/>
        <text x="37" y="20" fill="#aeb4bd" text-anchor="middle">Kotlin</text>
      </g>
    </g>

    <!-- stat -->
    <text x="0" y="344" fill="#9aa0a8" font-size="14">
      <tspan fill="#2fe3c0" font-weight="700">1,500+</tspan> technologies
      <tspan fill="#3a424b"> · </tspan>
      <tspan fill="#2fe3c0" font-weight="700">30+</tspan> categories
      <tspan fill="#3a424b"> · </tspan>
      <tspan fill="#2fe3c0" font-weight="700">8</tspan> intel layers
    </text>
  </g>

  <!-- ============ RIGHT: result card ============ -->
  <g transform="translate(724,48)">
    <rect x="0" y="0" width="420" height="284" rx="14" fill="#101216" stroke="#232a33"/>
    <!-- window chrome -->
    <circle cx="22" cy="24" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="24" r="5" fill="#ffbd2e"/>
    <circle cx="58" cy="24" r="5" fill="#27c93f"/>
    <text x="400" y="28" fill="#5a6069" font-size="12" text-anchor="end" font-family="monospace">ecliptic · scan</text>
    <line x1="0" y1="44" x2="420" y2="44" stroke="#232a33"/>

    <!-- url line -->
    <text x="20" y="72" font-family="monospace" font-size="13">
      <tspan fill="#21AD9A">scan</tspan><tspan fill="#cfd3d9">  example.com</tspan>
    </text>

    <!-- rows -->
    <g font-family="monospace" font-size="13">
      <!-- row 1 -->
      <text x="20" y="104" fill="#e8eaed">WordPress <tspan fill="#5a6069">6.4</tspan></text>
      <text x="400" y="104" fill="#6b7179" text-anchor="end">CMS</text>
      <!-- row 2 -->
      <text x="20" y="132" fill="#e8eaed">React <tspan fill="#5a6069">18.2</tspan></text>
      <text x="400" y="132" fill="#6b7179" text-anchor="end">framework</text>
      <!-- row 3 -->
      <text x="20" y="160" fill="#e8eaed">Cloudflare</text>
      <text x="400" y="160" fill="#6b7179" text-anchor="end">CDN</text>

      <!-- highlighted api row -->
      <rect x="10" y="176" width="400" height="30" rx="7" fill="#13241f" stroke="#21AD9A" stroke-opacity="0.45"/>
      <text x="20" y="196" fill="#2fe3c0" font-weight="700">GraphQL</text>
      <text x="108" y="196" fill="#8a9099">/graphql</text>
      <rect x="352" y="182" width="48" height="18" rx="9" fill="#21AD9A" fill-opacity="0.18"/>
      <text x="376" y="195" fill="#5eead4" font-size="11" text-anchor="middle" font-weight="700">API</text>

      <!-- security row -->
      <text x="20" y="230" fill="#e8eaed">CSP <tspan fill="#27c93f">present</tspan></text>
      <text x="400" y="230" fill="#6b7179" text-anchor="end">headers 7/10</text>
    </g>

    <line x1="0" y1="248" x2="420" y2="248" stroke="#232a33"/>
    <text x="20" y="270" font-size="12" fill="#6b7179" font-family="monospace">Tech · Intel · Code · Repeat · <tspan fill="#2fe3c0">Spider</tspan></text>
  </g>
</svg>
